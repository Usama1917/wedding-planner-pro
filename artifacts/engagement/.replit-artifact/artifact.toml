kind = "web"
previewPath = "/"
title = "Osama & Shahd"
version = "1.0.0"
id = "artifacts/engagement"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20425

[services.development]
run = "pnpm --filter @workspace/engagement run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/engagement", "run", "build" ]
publicDir = "artifacts/engagement/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20425"
BASE_PATH = "/"
